name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests, ui
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (mqx-core)
        run: cargo clippy -p mqx-core --all-targets -- -D warnings

      - name: test (mqx-core)
        run: cargo test -p mqx-core

      - name: clippy (mqtt-trace)
        run: cargo clippy -p mqtt-trace --all-targets -- -D warnings

      - name: test (mqtt-trace)
        run: cargo test -p mqtt-trace

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Frontend typecheck
        run: |
          npm ci
          npm run check

      - name: Install WebKit deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: cargo check (mqx)
        run: cargo check -p mqx
