[package]
name = "mqx-core"
version = "0.1.0"
edition = "2024"
description = "UI-agnostic MQTT explorer core"
license = "MIT"
publish = false

[dependencies]
bytes = "1"
directories = "6"
humantime-serde = "1.1.1"
indexmap = "2.10.0"
jaq-core = "2.2.1"
jaq-json = { version = "1.1.3", features = ["serde_json"] }
jaq-std = "2.1.2"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
rumqttc = { version = "0.24", features = ["use-rustls", "websocket"] }
rustls = "0.22"
rustls-pemfile = "2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.141", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
toml = "0.9.2"
tracing = "0.1.41"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "0.26"

[dev-dependencies]
tempfile = "3"
