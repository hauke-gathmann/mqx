name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  preflight:
    runs-on: ubuntu-22.04
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and signing configuration
        id: version
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test "$GITHUB_REF_TYPE" = tag || { echo 'Run releases from a version tag.' >&2; exit 1; }
          python3 scripts/release.py version --tag "$GITHUB_REF_NAME"
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Configure the updater signing key first; no Apple Developer ID is required.' >&2; exit 1; }
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then echo 'prerelease=true' >> "$GITHUB_OUTPUT"; else echo 'prerelease=false' >> "$GITHUB_OUTPUT"; fi

  build:
    needs: [quality, preflight]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-15
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: macos-x86_64
            os: macos-15-intel
            args: --target x86_64-apple-darwin --bundles app,dmg
          - name: linux-x86_64
            os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
          - name: windows-x86_64
            os: windows-2022
            args: --bundles nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev xdg-utils rpm
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.name }}
      - run: npm ci
      - name: Build and upload draft artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: mqx ${{ github.ref_name }}
          releaseBody: Build in progress. Do not publish until release verification succeeds.
          releaseDraft: true
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
          args: --config src-tauri/tauri.updater.conf.json ${{ matrix.args }} -- --locked
          uploadUpdaterJson: true
      - name: Verify macOS code signatures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          while IFS= read -r -d '' app; do codesign --verify --deep --strict "$app"; done < <(find target -path '*/bundle/macos/mqx.app' -type d -print0)
      - name: Save dependency notices
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-notices
          path: THIRD_PARTY_NOTICES.md
          if-no-files-found: error

  verify:
    needs: [build, preflight]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dependency-notices
          path: release-assets
      - name: Download and verify complete draft
        run: |
          gh release download "$RELEASE_TAG" --dir release-assets --clobber
          cp install.sh LICENSE release-assets/
          cp src-tauri/icons/128x128.png release-assets/mqx.png
          python3 scripts/release.py verify --tag "$RELEASE_TAG" --directory release-assets
          sudo apt-get update
          sudo apt-get install -y minisign
          python3 -c 'import base64,json; print(base64.b64decode(json.load(open("src-tauri/tauri.conf.json"))["plugins"]["updater"]["pubkey"]).decode(),end="")' > "$RUNNER_TEMP/updater.pub"
          for sig in release-assets/*.sig; do
            base64 --decode "$sig" > "$RUNNER_TEMP/signature"
            minisign -Vm "${sig%.sig}" -x "$RUNNER_TEMP/signature" -p "$RUNNER_TEMP/updater.pub"
          done
          python3 scripts/release.py checksums --directory release-assets
          python3 scripts/release.py notes --tag "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
          gh release upload "$RELEASE_TAG" release-assets/SHA256SUMS release-assets/install.sh release-assets/LICENSE release-assets/THIRD_PARTY_NOTICES.md release-assets/mqx.png --clobber
          gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          echo 'Verified draft is ready for installation testing. Publication remains manual.' >> "$GITHUB_STEP_SUMMARY"
