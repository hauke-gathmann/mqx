name: CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev xdg-utils rpm
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: npm run check
      - run: python3 scripts/release.py version
      - name: Installer and release tests
        if: runner.os != 'Windows'
        run: |
          sh -n install.sh
          npm run test:release
      - name: Dependency audit
        if: runner.os == 'Linux'
        run: |
          npm audit --audit-level=high
          cargo install cargo-audit --version 0.22.2 --locked
          node scripts/check-audit-exceptions.mjs
          cargo audit
      - name: Workflow and shell lint
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get install -y shellcheck
          gh release download v1.7.11 --repo rhysd/actionlint --pattern 'actionlint_1.7.11_linux_amd64.tar.gz' --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/actionlint_1.7.11_linux_amd64.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
          shellcheck install.sh
      - name: Smoke-test native packaging
        if: runner.os != 'Windows'
        run: npm run tauri build -- --bundles ${{ runner.os == 'macOS' && 'app,dmg' || 'deb,rpm,appimage' }} -- --locked
      - name: Test real macOS installation and replacement
        if: runner.os == 'macOS'
        run: python3 scripts/smoke-macos-install.py target/release/bundle/dmg/*.dmg
      - name: Save installation test packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-installation-packages
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
