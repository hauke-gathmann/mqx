[package]
name = "mqtt-trace"
version = "0.1.0"
edition = "2024"
description = "Record and replay MQTT broker traffic in real time"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
rumqttc = { version = "0.24", features = ["use-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
