name: Dispatch issue to Grok

on:
  issues:
    types: [opened]

permissions:
  issues: read
  contents: read

jobs:
  dispatch:
    name: Notify Grok auto-fix agent
    runs-on: ubuntu-22.04
    if: ${{ !github.event.issue.pull_request && secrets.GROK_WEBHOOK_URL != '' && secrets.GROK_WEBHOOK_SECRET != '' }}
    steps:
      - name: POST GitHub issue event to Grok webhook
        env:
          WEBHOOK_URL: ${{ secrets.GROK_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.GROK_WEBHOOK_SECRET }}
        run: |
          python3 << 'PY'
          import base64
          import hashlib
          import hmac
          import os
          import time
          import urllib.error
          import urllib.request
          import uuid

          url = os.environ["WEBHOOK_URL"]
          secret = os.environ["WEBHOOK_SECRET"]
          body = open(os.environ["GITHUB_EVENT_PATH"], "rb").read()
          webhook_id = f"msg_{uuid.uuid4().hex}"
          timestamp = str(int(time.time()))
          key = base64.b64decode(secret.removeprefix("whsec_"))
          signed_content = f"{webhook_id}.{timestamp}.".encode() + body
          signature = base64.b64encode(
              hmac.new(key, signed_content, hashlib.sha256).digest()
          ).decode()
          request = urllib.request.Request(
              url,
              data=body,
              headers={
                  "content-type": "application/json",
                  "webhook-id": webhook_id,
                  "webhook-timestamp": timestamp,
                  "webhook-signature": f"v1,{signature}",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request) as response:
                  print(f"Grok webhook accepted: HTTP {response.status}")
          except urllib.error.HTTPError as error:
              print(error.read().decode("utf-8", errors="replace"))
              raise SystemExit(f"Grok webhook failed: HTTP {error.code}")
          PY
